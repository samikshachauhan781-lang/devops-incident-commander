# Render Blueprint — DevOps Incident Commander (public demo)
# Apply via Dashboard: New > Blueprint > connect repo.
# Set CORS_ALLOWED_ORIGINS and VITE_API_BASE_URL after first deploy (see README).

services:
  - type: web
    name: dic-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 create_demo_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DB_PATH
        value: /tmp/incidents_demo.db
      - key: DEMO_DB_SEED_PATH
        value: incidents_demo.db
      - key: DEMO_DB_REFRESH_ON_START
        value: "true"
      # Set to your static site URL(s), comma-separated, e.g. https://dic-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: dic-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to your dic-api public URL, e.g. https://dic-api.onrender.com (no trailing slash)
      - key: VITE_API_BASE_URL
        sync: false
